[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
