[package]
name = "afterglow-setup"
# Its version is the app's, from ../Cargo.toml (see build.rs).
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
rfd = "0.17.2"

[build-dependencies]
embed-resource = "3.0.12"
