# Builds Afterglow whenever main changes (a merge or a push) and publishes it
# as a GitHub release named after the version in Cargo.toml. If that version
# is already released, the build and tests still run as a check, but nothing
# is published: bump the version in Cargo.toml to release again.
# The libmpv it ships is a GPL build, so releases are for private use (the
# repository is private); see Licensing in the README.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # The shinchiro/mpv-winbuild-cmake release to take libmpv from, such as
  # "20261016"; empty for the newest.
  MPV_BUILD: ""

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:MPV_BUILD
          if (-not $tag) {
            $tag = gh release view --repo shinchiro/mpv-winbuild-cmake --json tagName --jq .tagName
          }
          # The plain x86-64 build (not the -v3 one, which needs newer CPUs).
          gh release download $tag --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir mpv
          7z e (Get-Item mpv\*.7z).FullName libmpv-2.dll -r -ovendor -y
          if (-not (Test-Path vendor\libmpv-2.dll)) { throw "libmpv-2.dll not found in the archive" }
          "MPV_TAG=$tag" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "Afterglow-$version"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target\release\afterglow.exe, target\release\libmpv-2.dll, README.md $name
          @"
          This build of Afterglow is for private use only; please don't share it.

          libmpv-2.dll is mpv (https://mpv.io), as built by
          https://github.com/shinchiro/mpv-winbuild-cmake (release $env:MPV_TAG).
          It is a GPL build: mpv and the FFmpeg libraries in it are free software
          under the GNU GPL and LGPL. Their source code and exact license terms are
          at https://github.com/mpv-player/mpv and https://ffmpeg.org, and the
          build recipe at https://github.com/shinchiro/mpv-winbuild-cmake.

          The icons are Phosphor (https://phosphoricons.com), under the MIT license.
          "@ | Set-Content -Encoding utf8 "$name\THIRD-PARTY.txt"
          Compress-Archive $name "$name-windows-x64.zip"
          "VERSION=$version" >> $env:GITHUB_ENV
          "ZIP=$name-windows-x64.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            "::notice::$tag is already released; bump the version in Cargo.toml to publish a new release."
            exit 0
          }
          gh release create $tag $env:ZIP --title "Afterglow $env:VERSION" --generate-notes --target $env:GITHUB_SHA
