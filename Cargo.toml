[package]
name = "afterglow"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/masterluma64/afterglow"

# The setup that installs afterglow.exe (setup/) is built on its own, after
# the app: see docs/releasing.md.
[workspace]
members = [".", "setup"]
default-members = ["."]

[dependencies]
# Checks that an update was signed by the maintainer (see src/update.rs).
ed25519-dalek = "2.2.0"
# Without wgpu, Linux and web support: the UI is drawn with OpenGL only.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links", "system_fonts"] }
libloading = "0.9.0"
liblzma = "0.4.9"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Unpacks downloaded updates.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }
souvlaki = { version = "0.8.3", default-features = false }
# Asks GitHub for new releases, over Windows' own TLS.
ureq = { version = "3.5.2", default-features = false, features = ["json", "native-tls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Makes the release signing key (see examples/sign_release.rs).
getrandom = "0.3.4"

[build-dependencies]
embed-resource = "3.0.12"
liblzma = "0.4.9"
sha2 = "0.11.1"

[profile.release]
# Thin LTO over the default 16 code units: a release rebuild takes about a
# quarter of the time full LTO on one unit did, for a slightly larger exe.
lto = "thin"

[profile.release.build-override]
# The build script packs libmpv with xz, which is slow unoptimized.
opt-level = 3
